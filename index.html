<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이물관리 - 순수본 2공장 (프로토타입)</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --border:#d0d5dd;
    --accent:#2f6fed;
    --accent-fill:rgba(47,111,237,0.18);
    --danger:#e0473f;
    --bg:#f5f6f8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:var(--bg);
    color:#1c2430;
  }
  header{
    background:#1c2430;
    color:#fff;
    padding:12px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
  }
  header h1{font-size:16px;margin:0;font-weight:600;}
  header .status{font-size:12px;color:#aab3c2;}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;}
  button{
    font-family:inherit;
    font-size:13px;
    padding:7px 12px;
    border-radius:6px;
    border:1px solid var(--border);
    background:#fff;
    cursor:pointer;
  }
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  button.danger{background:#fff;border-color:var(--danger);color:var(--danger);}
  button.active{background:#123a99;border-color:#123a99;color:#fff;}
  button:hover{filter:brightness(0.97);}
  .main-layout{
    display:flex;
    gap:16px;
    padding:16px;
    align-items:flex-start;
  }
  .plan-wrap{
    position:relative;
    display:inline-block;
    background:#fff;
    border:1px solid var(--border);
    line-height:0;
    user-select:none;
    max-width:min(72vw, 900px);
  }
  .plan-wrap.edit-mode{cursor:crosshair;}
  #floorplanImg{
    display:block;
    width:100%;
    height:auto;
    pointer-events:none;
  }
  #overlay{
    position:absolute;
    inset:0;
  }
  .zone-box{
    position:absolute;
    border:2px solid var(--accent);
    background:var(--accent-fill);
    cursor:pointer;
  }
  .zone-box.selected{
    border-color:#ff8a00;
    background:rgba(255,138,0,0.22);
  }
  .zone-label{
    position:absolute;
    top:-2px;
    left:2px;
    transform:translateY(-100%);
    background:var(--accent);
    color:#fff;
    font-size:11px;
    padding:2px 6px;
    border-radius:4px 4px 0 0;
    white-space:nowrap;
  }
  .zone-box.selected .zone-label{background:#ff8a00;}
  .drag-preview{
    position:absolute;
    border:2px dashed var(--accent);
    background:rgba(47,111,237,0.10);
    pointer-events:none;
  }
  aside{
    width:300px;
    flex-shrink:0;
    background:#fff;
    border:1px solid var(--border);
    border-radius:8px;
    padding:14px;
  }
  aside h2{font-size:14px;margin:0 0 10px;}
  #zoneList{list-style:none;margin:0 0 16px;padding:0;max-height:260px;overflow:auto;}
  #zoneList li{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:6px 8px;
    border-radius:6px;
    font-size:13px;
    cursor:pointer;
  }
  #zoneList li:hover{background:#f0f2f5;}
  #zoneList li.selected{background:#eef3ff;font-weight:600;}
  #zoneList li button{padding:2px 6px;font-size:11px;}
  #zoneList .empty{color:#8a94a6;font-size:12px;padding:6px 8px;}
  #detailPanel{
    border-top:1px solid var(--border);
    padding-top:12px;
    font-size:13px;
    color:#444;
    min-height:80px;
  }
  #detailPanel .placeholder{color:#8a94a6;}
  .hint{font-size:12px;color:#8a94a6;margin-top:10px;line-height:1.5;}
  .modal{
    position:fixed;inset:0;background:rgba(0,0,0,0.35);
    display:flex;align-items:center;justify-content:center;
    z-index:50;
  }
  .modal.hidden{display:none;}
  .modal-box{
    background:#fff;border-radius:8px;padding:20px;width:280px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
  }
  .modal-box label{font-size:13px;display:block;margin-bottom:6px;}
  .modal-box input{
    width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;
    font-size:14px;margin-bottom:14px;
  }
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;}
  footer{padding:0 16px 16px;font-size:12px;color:#8a94a6;}
</style>
</head>
<body>
<header>
  <div>
    <h1>이물관리 - 순수본 2공장 1층 (프로토타입 · 1단계: 구역 지도)</h1>
    <div class="status" id="statusLine">연결 확인 중...</div>
  </div>
  <div class="toolbar">
    <button id="btnEditMode">구역 편집 모드 켜기</button>
    <button id="btnExport">내보내기 (zones.json)</button>
    <button id="btnImportTrigger">가져오기</button>
    <input type="file" id="importFile" accept="application/json" style="display:none;">
  </div>
</header>
<div class="main-layout">
  <div class="plan-wrap" id="planWrap">
    <img id="floorplanImg" src="floorplan.png" alt="2공장 1층 평면도">
    <div id="overlay"></div>
  </div>
  <aside>
    <h2>공정구역 목록 (<span id="zoneCount">0</span>)</h2>
    <ul id="zoneList"><li class="empty">아직 그려진 구역이 없습니다.</li></ul>
    <div id="detailPanel"><span class="placeholder">구역을 클릭하면 여기에 설비 목록이 표시됩니다.</span></div>
    <div class="hint">
      "구역 편집 모드"를 켠 뒤 도면 위에서 마우스로 드래그하면 사각형 구역을 그릴 수 있습니다.<br>
      이름을 입력하면 구역으로 저장됩니다. 편집 모드를 끄면 구역을 클릭해 선택할 수 있습니다.
    </div>
  </aside>
</div>
<footer>본죽 순수본 2공장 · 이물 클레임 대응 관리 도구 · 프로토타입 v0.1 (도면: 2025-08-18 2공장 1층 평면도)</footer>

<div class="modal hidden" id="nameModal">
  <div class="modal-box">
    <label for="zoneNameInput">구역 이름</label>
    <input id="zoneNameInput" type="text" placeholder="예: 원료투입, 세척, 조리, 포장">
    <div class="modal-actions">
      <button id="zoneNameCancel">취소</button>
      <button id="zoneNameSave" class="primary">저장</button>
    </div>
  </div>
</div>

<div class="modal hidden" id="equipModal">
  <div class="modal-box">
    <label for="equipNameInput">설비명 *</label>
    <input id="equipNameInput" type="text" placeholder="예: 2,000L 추출탱크 1호">
    <label for="equipModelInput">모델/규격 (선택)</label>
    <input id="equipModelInput" type="text" placeholder="예: 제작사·용량 등">
    <label for="equipNoteInput">비고 (선택)</label>
    <input id="equipNoteInput" type="text" placeholder="예: 설치 위치, 특이사항">
    <div class="modal-actions">
      <button id="equipCancel">취소</button>
      <button id="equipSave" class="primary">저장</button>
    </div>
  </div>
</div>

<script>
(function(){
  var zones = [];
  var editMode = false;
  var selectedZoneId = null;
  var drawing = false;
  var dragStart = null;
  var pendingRect = null;

  var planWrap = document.getElementById('planWrap');
  var overlay = document.getElementById('overlay');
  var img = document.getElementById('floorplanImg');
  var btnEditMode = document.getElementById('btnEditMode');
  var zoneListEl = document.getElementById('zoneList');
  var zoneCountEl = document.getElementById('zoneCount');
  var detailPanel = document.getElementById('detailPanel');
  var nameModal = document.getElementById('nameModal');
  var zoneNameInput = document.getElementById('zoneNameInput');
  var statusLine = document.getElementById('statusLine');

  // ---- Firebase (같은 프로젝트 ssbon-64b4f, 이물관리 전용 컬렉션으로 분리) ----
  var FB_DB = null;
  var ZONES_COL = 'claimdefense_zones';
  function initFB(){
    try{
      if(FB_DB) return FB_DB;
      if(typeof firebase === 'undefined') return null;
      var cfg = {
        apiKey: "AIzaSyCw3KlYX6A-OMbAojirXdluNeU7g6286cM",
        authDomain: "ssbon-64b4f.firebaseapp.com",
        projectId: "ssbon-64b4f",
        storageBucket: "ssbon-64b4f.appspot.com"
      };
      if(!firebase.apps || !firebase.apps.length){ firebase.initializeApp(cfg); }
      FB_DB = firebase.firestore();
      return FB_DB;
    }catch(e){
      console.warn('FB init 실패', e);
      return null;
    }
  }
  function setStatus(text, ok){
    if(!statusLine) return;
    statusLine.textContent = text;
    statusLine.style.color = ok === false ? '#ffb4b4' : (ok === true ? '#9be89b' : '#aab3c2');
  }
  function loadZonesFromFirestore(){
    var db = initFB();
    if(!db){
      setStatus('Firebase 연결 안 됨 · 로컬 메모리에만 보관(새로고침 시 사라짐)', false);
      renderAll();
      return;
    }
    setStatus('불러오는 중...');
    db.collection(ZONES_COL).get().then(function(snap){
      zones = [];
      snap.forEach(function(doc){
        var d = doc.data();
        zones.push({id: doc.id, name: d.name, x: d.x, y: d.y, w: d.w, h: d.h});
      });
      renderAll();
      setStatus('Firebase 연결됨 · 구역 ' + zones.length + '개 불러옴 · 자동 저장됨', true);
    }).catch(function(e){
      console.warn('불러오기 실패', e);
      setStatus('Firebase 연결 실패 · 로컬 메모리에만 보관(새로고침 시 사라짐)', false);
      renderAll();
    });
  }
  function saveZoneToFirestore(z){
    var db = initFB();
    if(!db) return;
    db.collection(ZONES_COL).doc(z.id).set({
      name: z.name, x: z.x, y: z.y, w: z.w, h: z.h, updatedAt: Date.now()
    }).then(function(){
      setStatus('Firebase 연결됨 · 마지막 저장 ' + new Date().toLocaleTimeString('ko-KR'), true);
    }).catch(function(e){
      console.warn('저장 실패', e);
      setStatus('저장 실패(오프라인?) · 이 구역은 새로고침 시 사라질 수 있음', false);
    });
  }
  function deleteZoneFromFirestore(id){
    var db = initFB();
    if(!db) return;
    db.collection(ZONES_COL).doc(id).delete().catch(function(e){
      console.warn('삭제 반영 실패', e);
    });
  }

  // ---- 설비 (구역에 속함) ----
  var equipment = [];
  var EQUIP_COL = 'claimdefense_equipment';
  function loadEquipmentFromFirestore(){
    var db = initFB();
    if(!db) return;
    db.collection(EQUIP_COL).get().then(function(snap){
      equipment = [];
      snap.forEach(function(doc){
        var d = doc.data();
        equipment.push({id: doc.id, zoneId: d.zoneId, name: d.name, model: d.model || '', note: d.note || ''});
      });
      if(selectedZoneId){ renderDetailPanel(selectedZoneId); }
    }).catch(function(e){
      console.warn('설비 불러오기 실패', e);
    });
  }
  function saveEquipmentToFirestore(eq){
    var db = initFB();
    if(!db) return;
    db.collection(EQUIP_COL).doc(eq.id).set({
      zoneId: eq.zoneId, name: eq.name, model: eq.model || '', note: eq.note || '', updatedAt: Date.now()
    }).catch(function(e){ console.warn('설비 저장 실패', e); });
  }
  function deleteEquipmentFromFirestore(id){
    var db = initFB();
    if(!db) return;
    db.collection(EQUIP_COL).doc(id).delete().catch(function(e){
      console.warn('설비 삭제 반영 실패', e);
    });
  }
  function addEquipment(zoneId, name, model, note){
    var eq = {id: uid(), zoneId: zoneId, name: name, model: model || '', note: note || ''};
    equipment.push(eq);
    renderDetailPanel(zoneId);
    saveEquipmentToFirestore(eq);
  }
  function deleteEquipment(id, zoneId, evt){
    if(evt) evt.stopPropagation();
    if(!confirm('이 설비를 삭제할까요? (연결된 부품·점검이력은 다음 단계에서 다룰 예정입니다)')) return;
    equipment = equipment.filter(function(e){ return e.id !== id; });
    renderDetailPanel(zoneId);
    deleteEquipmentFromFirestore(id);
  }

  function uid(){
    return 'z_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8);
  }

  function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }

  function getRelativePoint(evt){
    var rect = overlay.getBoundingClientRect();
    var x = clamp((evt.clientX - rect.left) / rect.width * 100, 0, 100);
    var y = clamp((evt.clientY - rect.top) / rect.height * 100, 0, 100);
    return {x: x, y: y};
  }

  function setEditMode(on){
    editMode = on;
    planWrap.classList.toggle('edit-mode', on);
    btnEditMode.textContent = on ? '구역 편집 모드 끄기 (보기 모드로)' : '구역 편집 모드 켜기';
    btnEditMode.classList.toggle('active', on);
    if(!on){
      cancelDrawing();
    }
  }

  function cancelDrawing(){
    drawing = false;
    dragStart = null;
    if(pendingRect && pendingRect.parentNode){
      pendingRect.parentNode.removeChild(pendingRect);
    }
    pendingRect = null;
  }

  function onOverlayMouseDown(evt){
    if(!editMode) return;
    drawing = true;
    dragStart = getRelativePoint(evt);
    pendingRect = document.createElement('div');
    pendingRect.className = 'drag-preview';
    overlay.appendChild(pendingRect);
    updatePendingRect(dragStart);
  }

  function onOverlayMouseMove(evt){
    if(!editMode || !drawing) return;
    var p = getRelativePoint(evt);
    updatePendingRect(p);
  }

  function updatePendingRect(current){
    var x1 = Math.min(dragStart.x, current.x);
    var y1 = Math.min(dragStart.y, current.y);
    var w = Math.abs(current.x - dragStart.x);
    var h = Math.abs(current.y - dragStart.y);
    pendingRect.style.left = x1 + '%';
    pendingRect.style.top = y1 + '%';
    pendingRect.style.width = w + '%';
    pendingRect.style.height = h + '%';
    pendingRect.dataset.x = x1;
    pendingRect.dataset.y = y1;
    pendingRect.dataset.w = w;
    pendingRect.dataset.h = h;
  }

  function onOverlayMouseUp(evt){
    if(!editMode || !drawing) return;
    drawing = false;
    var x = parseFloat(pendingRect.dataset.x);
    var y = parseFloat(pendingRect.dataset.y);
    var w = parseFloat(pendingRect.dataset.w);
    var h = parseFloat(pendingRect.dataset.h);
    if(w < 1 || h < 1){
      cancelDrawing();
      return;
    }
    openNameModal(function(name){
      if(name){
        var z = {id: uid(), name: name, x: x, y: y, w: w, h: h};
        zones.push(z);
        renderAll();
        saveZoneToFirestore(z);
      }
      cancelDrawing();
    });
  }

  function openNameModal(callback){
    zoneNameInput.value = '';
    nameModal.classList.remove('hidden');
    setTimeout(function(){ zoneNameInput.focus(); }, 0);
    function cleanup(result){
      nameModal.classList.add('hidden');
      document.getElementById('zoneNameSave').removeEventListener('click', onSave);
      document.getElementById('zoneNameCancel').removeEventListener('click', onCancel);
      zoneNameInput.removeEventListener('keydown', onKeydown);
      callback(result);
    }
    function onSave(){ cleanup(zoneNameInput.value.trim()); }
    function onCancel(){ cleanup(null); }
    function onKeydown(e){
      if(e.key === 'Enter'){ onSave(); }
      if(e.key === 'Escape'){ onCancel(); }
    }
    document.getElementById('zoneNameSave').addEventListener('click', onSave);
    document.getElementById('zoneNameCancel').addEventListener('click', onCancel);
    zoneNameInput.addEventListener('keydown', onKeydown);
  }

  function openEquipModal(callback){
    var equipModal = document.getElementById('equipModal');
    var nameEl = document.getElementById('equipNameInput');
    var modelEl = document.getElementById('equipModelInput');
    var noteEl = document.getElementById('equipNoteInput');
    nameEl.value = ''; modelEl.value = ''; noteEl.value = '';
    equipModal.classList.remove('hidden');
    setTimeout(function(){ nameEl.focus(); }, 0);
    function cleanup(result){
      equipModal.classList.add('hidden');
      document.getElementById('equipSave').removeEventListener('click', onSave);
      document.getElementById('equipCancel').removeEventListener('click', onCancel);
      callback(result);
    }
    function onSave(){
      var name = nameEl.value.trim();
      if(!name){ nameEl.focus(); return; }
      cleanup({name: name, model: modelEl.value.trim(), note: noteEl.value.trim()});
    }
    function onCancel(){ cleanup(null); }
    document.getElementById('equipSave').addEventListener('click', onSave);
    document.getElementById('equipCancel').addEventListener('click', onCancel);
  }

  function renderDetailPanel(zoneId){
    var z = zones.find(function(zz){ return zz.id === zoneId; });
    if(!z){
      detailPanel.innerHTML = '<span class="placeholder">구역을 클릭하면 여기에 설비 목록이 표시될 예정입니다.</span>';
      return;
    }
    var list = equipment.filter(function(e){ return e.zoneId === zoneId; });
    var html = '<strong>' + escapeHtml(z.name) + '</strong>';
    html += '<div style="margin-top:10px;font-weight:600;font-size:12px;color:#555;">설비 목록 (' + list.length + ')</div>';
    if(list.length === 0){
      html += '<div class="placeholder" style="margin:6px 0;">등록된 설비가 없습니다.</div>';
    } else {
      html += '<ul style="list-style:none;margin:6px 0;padding:0;">';
      list.forEach(function(e){
        html += '<li data-equip-id="' + e.id + '" style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #eee;font-size:12px;">' +
          '<span><strong>' + escapeHtml(e.name) + '</strong>' +
          (e.model ? ' <span style="color:#888;">· ' + escapeHtml(e.model) + '</span>' : '') +
          (e.note ? '<br><span style="color:#888;font-size:11px;">' + escapeHtml(e.note) + '</span>' : '') +
          '</span>' +
          '<button class="danger equip-del-btn" data-equip-id="' + e.id + '" style="flex-shrink:0;margin-left:8px;">삭제</button>' +
          '</li>';
      });
      html += '</ul>';
    }
    html += '<button id="btnAddEquipment" class="primary" style="margin-top:6px;">+ 설비 추가</button>';
    html += '<div class="placeholder" style="margin-top:10px;font-size:11px;">부품 · 점검주기 · 점검이력은 다음 단계에서 각 설비에 연결됩니다.</div>';
    detailPanel.innerHTML = html;

    document.getElementById('btnAddEquipment').addEventListener('click', function(){
      openEquipModal(function(result){
        if(result){ addEquipment(zoneId, result.name, result.model, result.note); }
      });
    });
    detailPanel.querySelectorAll('.equip-del-btn').forEach(function(btn){
      btn.addEventListener('click', function(evt){
        deleteEquipment(btn.dataset.equipId, zoneId, evt);
      });
    });
  }

  function selectZone(id){
    selectedZoneId = id;
    renderAll();
    renderDetailPanel(id);
  }

  function deleteZone(id, evt){
    if(evt) evt.stopPropagation();
    var hasEquip = equipment.some(function(e){ return e.zoneId === id; });
    var msg = hasEquip
      ? '이 구역에는 등록된 설비가 있습니다. 구역을 삭제해도 설비 데이터는 남아있지만 화면에서 연결이 끊깁니다. 그래도 삭제할까요?'
      : '이 구역을 삭제할까요?';
    if(!confirm(msg)) return;
    zones = zones.filter(function(z){ return z.id !== id; });
    if(selectedZoneId === id){
      selectedZoneId = null;
      detailPanel.innerHTML = '<span class="placeholder">구역을 클릭하면 여기에 설비 목록이 표시될 예정입니다.</span>';
    }
    renderAll();
    deleteZoneFromFirestore(id);
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function renderZonesOnImage(){
    var existing = overlay.querySelectorAll('.zone-box');
    existing.forEach(function(el){ el.remove(); });
    zones.forEach(function(z){
      var box = document.createElement('div');
      box.className = 'zone-box' + (z.id === selectedZoneId ? ' selected' : '');
      box.style.left = z.x + '%';
      box.style.top = z.y + '%';
      box.style.width = z.w + '%';
      box.style.height = z.h + '%';
      box.dataset.zoneId = z.id;
      var label = document.createElement('span');
      label.className = 'zone-label';
      label.textContent = z.name;
      box.appendChild(label);
      box.addEventListener('click', function(evt){
        if(editMode) return;
        evt.stopPropagation();
        selectZone(z.id);
      });
      overlay.appendChild(box);
    });
  }

  function renderZoneList(){
    zoneListEl.innerHTML = '';
    zoneCountEl.textContent = zones.length;
    if(zones.length === 0){
      var empty = document.createElement('li');
      empty.className = 'empty';
      empty.textContent = '아직 그려진 구역이 없습니다.';
      zoneListEl.appendChild(empty);
      return;
    }
    zones.forEach(function(z){
      var li = document.createElement('li');
      li.className = z.id === selectedZoneId ? 'selected' : '';
      var nameSpan = document.createElement('span');
      nameSpan.textContent = z.name;
      nameSpan.style.cursor = 'pointer';
      nameSpan.addEventListener('click', function(){ selectZone(z.id); });
      var delBtn = document.createElement('button');
      delBtn.textContent = '삭제';
      delBtn.className = 'danger';
      delBtn.addEventListener('click', function(evt){ deleteZone(z.id, evt); });
      li.appendChild(nameSpan);
      li.appendChild(delBtn);
      zoneListEl.appendChild(li);
    });
  }

  function renderAll(){
    renderZonesOnImage();
    renderZoneList();
  }

  function exportZones(){
    var blob = new Blob([JSON.stringify(zones, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'zones.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function importZones(file){
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        if(Array.isArray(data)){
          zones = data;
          selectedZoneId = null;
          renderAll();
        }
      }catch(e){
        alert('zones.json 형식이 올바르지 않습니다.');
      }
    };
    reader.readAsText(file);
  }

  btnEditMode.addEventListener('click', function(){ setEditMode(!editMode); });
  document.getElementById('btnExport').addEventListener('click', exportZones);
  document.getElementById('btnImportTrigger').addEventListener('click', function(){
    document.getElementById('importFile').click();
  });
  document.getElementById('importFile').addEventListener('change', function(evt){
    if(evt.target.files && evt.target.files[0]){
      importZones(evt.target.files[0]);
      evt.target.value = '';
    }
  });

  overlay.addEventListener('mousedown', onOverlayMouseDown);
  window.addEventListener('mousemove', onOverlayMouseMove);
  window.addEventListener('mouseup', onOverlayMouseUp);

  loadZonesFromFirestore();
  loadEquipmentFromFirestore();

  // Exposed for automated testing (Node/jsdom + Playwright verification).
  window.__zoneApp = {
    getZones: function(){ return zones.slice(); },
    addZoneProgrammatic: function(z){
      var zz = Object.assign({id: uid()}, z);
      zones.push(zz);
      renderAll();
      saveZoneToFirestore(zz);
      return zz;
    },
    setEditMode: setEditMode,
    selectZone: selectZone,
    getEquipment: function(){ return equipment.slice(); },
    addEquipment: addEquipment
  };
})();
</script>
</body>
</html>
